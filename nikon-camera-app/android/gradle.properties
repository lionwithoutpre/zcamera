# 镜像已指向腾讯云,无需从 services.gradle.org 慢速下载。
VERSION_JAVA=17
VERSION_AGP=8.2.2
VERSION_KOTLIN=1.9.22
VERSION_KOTLIN_COMPILER_EXT=1.5.8
COMPOSE_BOM=2024.02.00
